<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258" role="img" aria-labelledby="qt-title qt-desc">
  <title id="qt-title">Quick start</title>
  <desc id="qt-desc">Set up once, then register it with your client: npx -y @jtalk22/slack-mcp --setup, then claude mcp add slack -- npx -y @jtalk22/slack-mcp. Check your own setup: npx -y @jtalk22/slack-mcp --doctor --security. Read Slack, never write to it: npx -y @jtalk22/slack-mcp --read-only.</desc>
  <defs>
    <style>
      .t  { font: 400 14.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .c  { fill: #7D8590; }
      .p  { fill: #C9A6CC; font-weight: 700; }
      .x  { fill: #E6EDF3; }
      .f  { fill: #D7B8D9; }
      .bar { font: 500 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8B8F98; }
    </style>
  </defs>
  <rect width="640" height="258" rx="12" fill="#111318"/>
  <rect x="0.5" y="0.5" width="639" height="257" rx="11.5" fill="none" stroke="#2A2D34"/>
  <circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
  <text class="bar" x="320" y="24" text-anchor="middle">slack-mcp</text>
  <line x1="0" y1="40" x2="640" y2="40" stroke="#22252B"/>
  <g class="t" xml:space="preserve">
    <text x="24" y="70"><tspan class="c"># set up once, then register it with your client</tspan></text>
    <text x="24" y="94"><tspan class="p">$</tspan><tspan class="x"> npx -y @jtalk22/slack-mcp </tspan><tspan class="f">--setup</tspan></text>
    <text x="24" y="118"><tspan class="p">$</tspan><tspan class="x"> claude mcp add slack -- npx -y @jtalk22/slack-mcp</tspan></text>
    <text x="24" y="152"><tspan class="c"># check your own setup</tspan></text>
    <text x="24" y="176"><tspan class="p">$</tspan><tspan class="x"> npx -y @jtalk22/slack-mcp </tspan><tspan class="f">--doctor --security</tspan></text>
    <text x="24" y="210"><tspan class="c"># read Slack, never write to it</tspan></text>
    <text x="24" y="234"><tspan class="p">$</tspan><tspan class="x"> npx -y @jtalk22/slack-mcp </tspan><tspan class="f">--read-only</tspan></text>
  </g>
</svg>
