<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440"
     role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">What each tool profile costs per turn</title>
  <desc id="sb-desc">Estimated schema tokens the model receives per turn for each tool profile, measured on 2026-10-07. Essentials advertises 6 tools at about 1,474 estimated tokens, 37 percent of the full surface. Read advertises 13 tools at about 2,359, 59 percent. All advertises 20 tools at about 4,008 tokens, the full 100 percent. Narrowing the profile changes what is advertised, not what the server can do. Figures are a four-characters-per-token estimate, reproducible with node scripts slash measure-tool-schema.js.</desc>

  <defs>
    <style>
      .ground { fill: #FBFBF9; }
      .ink    { fill: #16181D; }
      .muted  { fill: #6B7280; }
      .faint  { fill: #9CA3AF; }

      .t-title { font: 600 27px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.25px; }
      .t-lede  { font: 400 16.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-name  { font: 500 18px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .t-sub   { font: 400 14.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-val   { font: 600 22px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-unit  { font: 400 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-mark  { font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 1.5px; }

      /* One hue, three steps, light to dark: this is magnitude, not identity. */
      .bar-1 { fill: #D7B8D9; }
      .bar-2 { fill: #9B4F96; }
      .bar-3 { fill: #4A154B; }
      .rail  { fill: #ECECEA; }
      .rule  { stroke: #E3E4E9; stroke-width: 1.25; }
    </style>
  </defs>

  <rect class="ground" width="1280" height="440"/>

  <text class="t-title ink" x="56" y="56">What each tool profile costs per turn</text>
  <text class="t-lede muted" x="56" y="84">Every advertised tool sends its JSON schema to the model on every turn. A narrower profile changes what is advertised, not what the server can do.</text>

  <!-- essentials -->
  <text class="t-name ink" x="56" y="152">essentials</text>
  <text class="t-sub faint" x="56" y="172">6 tools</text>
  <rect class="rail" x="240" y="132" width="860" height="30" rx="4"/>
  <rect class="bar-1" x="240" y="132" width="318" height="30" rx="4"/>
  <text class="t-val ink" x="578" y="155">1,474</text>
  <text class="t-unit faint" x="1100" y="154" text-anchor="end">37%</text>

  <!-- read -->
  <text class="t-name ink" x="56" y="232">read</text>
  <text class="t-sub faint" x="56" y="252">13 tools</text>
  <rect class="rail" x="240" y="212" width="860" height="30" rx="4"/>
  <rect class="bar-2" x="240" y="212" width="506" height="30" rx="4"/>
  <text class="t-val ink" x="766" y="235">2,359</text>
  <text class="t-unit faint" x="1100" y="234" text-anchor="end">59%</text>

  <!-- all -->
  <text class="t-name ink" x="56" y="312">all</text>
  <text class="t-sub faint" x="56" y="332">20 tools · the default</text>
  <rect class="rail" x="240" y="292" width="860" height="30" rx="4"/>
  <rect class="bar-3" x="240" y="292" width="860" height="30" rx="4"/>
  <text class="t-val ink" x="1120" y="315">4,008</text>
  <text class="t-unit" x="1080" y="314" text-anchor="end" fill="#FFFFFF">100%</text>

  <text class="t-mark muted" x="240" y="368">ESTIMATED SCHEMA TOKENS PER TURN</text>

  <line class="rule" x1="56" y1="394" x2="1224" y2="394"/>
  <text class="t-sub muted" x="56" y="420">Measured 2026-10-07, about four characters per token. Reproduce with <tspan fill="#16181D">node scripts/measure-tool-schema.js</tspan></text>
  <text class="t-sub faint" x="1224" y="418" text-anchor="end">@jtalk22/slack-mcp</text>
</svg>
