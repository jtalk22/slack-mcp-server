<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760"
     role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">The trust boundary: who wrote a Slack message, and what the server does about it</title>
  <desc id="tb-desc">Four kinds of author put text into the same Slack channel: you, a colleague in the workspace, a Slack Connect participant from another workspace, and an app relaying words written outside Slack. Each crosses the server's trust boundary on its own track and is stamped with an origin: self and internal are trusted, external and bot are labelled untrusted and passed through rather than removed. All four arrive in one model context beside your own instructions. On the way back out, strict mode holds a send once outside-authored text has been read, and read-only never registers the write tool at all.</desc>
  <defs>
    <style>
      .ground { fill: #FBFBF9; }
      .ink    { fill: #16181D; }
      .muted  { fill: #5F6470; }
      .faint  { fill: #8A8F9A; }
      .ok     { fill: #15803D; }
      .amber  { fill: #B45309; }
      .stop   { fill: #C2271D; }
      .brand  { fill: #4A154B; }
      .t-title { font: 600 34px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.4px; }
      .t-lede  { font: 400 19px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-name  { font: 600 22px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-sub   { font: 400 16px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-chip  { font: 500 19px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .t-cap   { font: 500 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-mark  { font: 700 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 1.8px; }
      .track    { stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .track.ok { stroke: #15803D; }
      .track.pass { stroke: #B45309; stroke-dasharray: 9 7; }
      .who.ok   { color: #15803D; } .who.pass { color: #B45309; }
      .glyph { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .wall  { stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
      .chip-ok   { fill: #E9F6EC; stroke: #15803D; stroke-width: 2.25; }
      .chip-pass { fill: #FFF4E5; stroke: #B45309; stroke-width: 2.25; stroke-dasharray: 7 5; }
      .chip-stop { fill: #FDECEB; stroke: #C2271D; stroke-width: 2.25; }
      .panel { fill: #F8F2F9; stroke: #D9C2DC; stroke-width: 2; }
      .flow  { stroke: #16181D; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16181D"/>
    </marker>
    <g id="g-you"><circle cx="17" cy="11" r="7.5" class="glyph"/><path d="M 3 34 a 14 13 0 0 1 28 0" class="glyph"/></g>
    <g id="g-colleagues"><circle cx="13" cy="11" r="6.8" class="glyph"/><path d="M 1 34 a 12 11.5 0 0 1 24 0" class="glyph"/><circle cx="30" cy="13" r="5.6" class="glyph"/><path d="M 21 34 a 9.6 9 0 0 1 19 0" class="glyph"/></g>
    <g id="g-connect"><circle cx="13" cy="11" r="7.2" class="glyph"/><path d="M 1 34 a 12.5 11.8 0 0 1 25 0" class="glyph"/><path d="M 35 1 L 35 36" class="wall" stroke-dasharray="4.5 5"/></g>
    <g id="g-relay"><rect x="1" y="6" width="24" height="23" rx="5" class="glyph"/><path d="M 8 15 h 11 M 8 21 h 7" class="glyph"/><path d="M 35 1 L 35 36" class="wall" stroke-dasharray="4.5 5"/><path d="M 27 17.5 h 4.5" class="glyph"/></g>
  </defs>

  <rect class="ground" width="1280" height="760"/>
  <text class="t-title ink" x="56" y="66">The trust boundary</text>
  <text class="t-lede muted" x="56" y="98">Four authors, one channel. Every message is stamped on the way in, and a bot inside your workspace still relays words from outside it.</text>

  <!-- the boundary -->
  <text class="t-mark brand" x="430" y="150" text-anchor="middle">THE BOUNDARY</text>
  <line x1="430" y1="162" x2="430" y2="562" stroke="#4A154B" stroke-width="3" stroke-dasharray="9 7"/>

  <!-- the context -->
  <rect class="panel" x="740" y="150" width="484" height="412" rx="16"/>
  <text class="t-mark brand" x="768" y="174">ONE MODEL CONTEXT</text>
  <rect x="768" y="184" width="428" height="36" rx="8" fill="#4A154B"/>
  <text class="t-cap" x="788" y="208" fill="#FFFFFF">Your own instructions</text>

  <!-- four tracks -->
  <g class="who ok" transform="translate(56,232)"><use href="#g-you"/></g>
  <text class="t-name ink" x="112" y="258">You</text>
  <line class="track ok" x1="330" y1="250" x2="470" y2="250"/>
  <rect class="chip-ok" x="470" y="226" width="150" height="48" rx="10"/><text class="t-chip ok" x="545" y="257" text-anchor="middle">self</text>
  <line class="track ok" x1="620" y1="250" x2="740" y2="250"/>
  <rect class="chip-ok" x="768" y="228" width="428" height="44" rx="9"/><text class="t-chip ok" x="788" y="257">self</text><text class="t-cap ok" x="1176" y="257" text-anchor="end">trusted</text>

  <g class="who ok" transform="translate(56,322)"><use href="#g-colleagues"/></g>
  <text class="t-name ink" x="112" y="348">A colleague</text>
  <line class="track ok" x1="330" y1="340" x2="470" y2="340"/>
  <rect class="chip-ok" x="470" y="316" width="150" height="48" rx="10"/><text class="t-chip ok" x="545" y="347" text-anchor="middle">internal</text>
  <line class="track ok" x1="620" y1="340" x2="740" y2="340"/>
  <rect class="chip-ok" x="768" y="318" width="428" height="44" rx="9"/><text class="t-chip ok" x="788" y="347">internal</text><text class="t-cap ok" x="1176" y="347" text-anchor="end">trusted</text>

  <g class="who pass" transform="translate(56,412)"><use href="#g-connect"/></g>
  <text class="t-name ink" x="112" y="430">Slack Connect</text>
  <text class="t-sub faint" x="112" y="452">someone else’s workspace</text>
  <line class="track pass" x1="330" y1="430" x2="470" y2="430"/>
  <rect class="chip-pass" x="470" y="406" width="150" height="48" rx="10"/><text class="t-chip amber" x="545" y="437" text-anchor="middle">external</text>
  <line class="track pass" x1="620" y1="430" x2="740" y2="430"/>
  <rect class="chip-pass" x="768" y="408" width="428" height="44" rx="9"/><text class="t-chip amber" x="788" y="437">external</text><text class="t-cap amber" x="1176" y="437" text-anchor="end">untrusted</text>

  <g class="who pass" transform="translate(56,502)"><use href="#g-relay"/></g>
  <text class="t-name ink" x="112" y="520">A relay app</text>
  <text class="t-sub faint" x="112" y="542">words written somewhere else</text>
  <line class="track pass" x1="330" y1="520" x2="470" y2="520"/>
  <rect class="chip-pass" x="470" y="496" width="150" height="48" rx="10"/><text class="t-chip amber" x="545" y="527" text-anchor="middle">bot</text>
  <line class="track pass" x1="620" y1="520" x2="740" y2="520"/>
  <rect class="chip-pass" x="768" y="498" width="428" height="44" rx="9"/><text class="t-chip amber" x="788" y="527">bot</text><text class="t-cap amber" x="1176" y="527" text-anchor="end">untrusted</text>

  <!-- the way back out -->
  <text class="t-mark muted" x="56" y="624">THE WAY BACK OUT</text>
  <text class="t-cap muted" x="56" y="652">Labels never remove a message, and the same</text>
  <text class="t-cap muted" x="56" y="676">toolset reads and writes. That is the risk.</text>

  <path class="flow" d="M 982 562 L 982 606" marker-end="url(#tb-arrow)"/>
  <rect x="862" y="606" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#4A154B" stroke-width="2.25"/>
  <text class="t-chip ink" x="982" y="637" text-anchor="middle">slack_send_message</text>
  <path class="flow" d="M 862 630 L 790 630" marker-end="url(#tb-arrow)"/>

  <rect class="chip-stop" x="470" y="588" width="310" height="40" rx="9"/>
  <text class="t-chip stop" x="490" y="615">strict</text><text class="t-cap stop" x="760" y="615" text-anchor="end">held</text>
  <rect class="chip-stop" x="470" y="636" width="310" height="40" rx="9"/>
  <text class="t-chip stop" x="490" y="663">read-only</text><text class="t-cap stop" x="760" y="663" text-anchor="end">never registered</text>

  <!-- legend -->
  <line x1="56" y1="710" x2="1224" y2="710" stroke="#E3E4E9" stroke-width="1.5"/>
  <rect x="56" y="728" width="14" height="14" rx="3" fill="#E9F6EC" stroke="#15803D" stroke-width="2"/>
  <text class="t-cap muted" x="80" y="741">placed inside your workspace</text>
  <rect x="340" y="728" width="14" height="14" rx="3" fill="#FFF4E5" stroke="#B45309" stroke-width="2" stroke-dasharray="3 2.5"/>
  <text class="t-cap muted" x="364" y="741">labelled, and passed through anyway</text>
  <rect x="700" y="728" width="14" height="14" rx="3" fill="#FDECEB" stroke="#C2271D" stroke-width="2"/>
  <text class="t-cap muted" x="724" y="741">refused</text>
  <text class="t-sub faint" x="1224" y="741" text-anchor="end">@jtalk22/slack-mcp</text>
</svg>
