<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">The trust boundary: who wrote a Slack message, and what the server does about it</title>
  <desc id="tb-desc">Four kinds of author put text into the same Slack channel: the operator, a colleague in the workspace, a Slack Connect participant from another workspace, and an app relaying content from outside Slack. Each crosses the server's trust boundary on its own track and is stamped with an origin. The operator and the colleague are stamped trusted; the outside participant and the relay app are labelled and passed through, not removed. All four land in one model context alongside the operator's own instructions. On the way back out, a send is held in strict mode once outside-authored text has been read, and in read-only mode the write tool is never registered at all.</desc>

  <defs>
    <style>
      .ground { fill: #FBFBF9; }
      .ink    { fill: #16181D; }
      .muted  { fill: #6B7280; }
      .ok     { fill: #15803D; }
      .stop   { fill: #DC2626; }

      .t-title { font: 600 27px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.2px; }
      .t-lede  { font: 400 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-name  { font: 500 16px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-chip  { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .t-cap   { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-mark  { font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 1.4px; }

      .track   { stroke: #C3C5CA; stroke-width: 1.5; fill: none; }
      .track-w { stroke: #16181D; stroke-width: 1.75; fill: none; }
      .edge    { stroke: #D9DAE0; stroke-width: 1.25; fill: none; }
      .panel   { fill: #FFFFFF; stroke: #E3E4E9; stroke-width: 1.25; }

      .chip-ok   { fill: #EDF7F0; stroke: #15803D; stroke-width: 1.75; }
      .chip-pass { fill: #F2F3F5; stroke: #9CA3AF; stroke-width: 1.75; stroke-dasharray: 5 4; }

      .glyph      { fill: none; stroke: #16181D; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .glyph-fill { fill: #16181D; }
      .wall       { stroke: #16181D; stroke-width: 1.5; stroke-linecap: round; }
    </style>

    <marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16181D"/>
    </marker>

    <!-- One glyph family. The small wall mark on the right of a glyph says the
         author sits outside this workspace; its absence says inside. The answer
         is in the icon before any word is read. -->
    <g id="g-you">
      <circle cx="11" cy="7.5" r="4.6" class="glyph"/>
      <path d="M 2.5 21 a 8.5 8 0 0 1 17 0" class="glyph"/>
    </g>
    <g id="g-colleagues">
      <circle cx="8" cy="7.5" r="4.2" class="glyph"/>
      <path d="M 0.5 21 a 7.5 7 0 0 1 15 0" class="glyph"/>
      <circle cx="18.5" cy="9" r="3.4" class="glyph"/>
      <path d="M 13 21 a 6 5.6 0 0 1 11.5 0" class="glyph"/>
    </g>
    <g id="g-connect">
      <circle cx="8" cy="7.5" r="4.4" class="glyph"/>
      <path d="M 0.5 21 a 7.8 7.2 0 0 1 15.5 0" class="glyph"/>
      <path d="M 21.5 1 L 21.5 22" class="wall" stroke-dasharray="3 3.5"/>
    </g>
    <g id="g-relay">
      <rect x="1" y="4" width="15" height="14" rx="3.4" class="glyph"/>
      <path d="M 5 9.5 h 7 M 5 13 h 4.5" class="glyph"/>
      <path d="M 21.5 1 L 21.5 22" class="wall" stroke-dasharray="3 3.5"/>
      <path d="M 17.5 11 h 2.2" class="glyph"/>
    </g>
  </defs>

  <rect class="ground" width="1280" height="720"/>

  <text class="t-title ink" x="56" y="62">The trust boundary</text>
  <text class="t-lede muted" x="56" y="90">Four authors share one channel. The server stamps each message as it crosses, and labels what it cannot place.</text>

  <!-- ===================== the boundary ===================== -->
  <line x1="408" y1="116" x2="408" y2="508" stroke="#16181D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="t-mark muted" x="408" y="106" text-anchor="middle">THE BOUNDARY</text>

  <!-- ===================== four parallel tracks =====================
       One straight line per author, crossing the boundary into its own stamp
       and continuing to its own row in the context. Nothing crosses anything. -->

  <!-- track 1 -->
  <g transform="translate(56,150)"><use href="#g-you"/></g>
  <text class="t-name ink" x="98" y="169">You</text>
  <line class="track" x1="250" y1="161" x2="452" y2="161"/>
  <rect class="chip-ok" x="452" y="143" width="124" height="36" rx="8"/>
  <text class="t-chip ok" x="514" y="166" text-anchor="middle">self</text>
  <line class="track" x1="576" y1="161" x2="700" y2="161"/>

  <!-- track 2 -->
  <g transform="translate(56,232)"><use href="#g-colleagues"/></g>
  <text class="t-name ink" x="98" y="251">A colleague</text>
  <line class="track" x1="250" y1="243" x2="452" y2="243"/>
  <rect class="chip-ok" x="452" y="225" width="124" height="36" rx="8"/>
  <text class="t-chip ok" x="514" y="248" text-anchor="middle">internal</text>
  <line class="track" x1="576" y1="243" x2="700" y2="243"/>

  <!-- track 3 -->
  <g transform="translate(56,314)"><use href="#g-connect"/></g>
  <text class="t-name ink" x="98" y="333">Slack Connect</text>
  <text class="t-cap muted" x="98" y="351">another workspace</text>
  <line class="track" x1="250" y1="325" x2="452" y2="325"/>
  <rect class="chip-pass" x="452" y="307" width="124" height="36" rx="8"/>
  <text class="t-chip ink" x="514" y="330" text-anchor="middle">external</text>
  <line class="track" x1="576" y1="325" x2="700" y2="325"/>

  <!-- track 4 -->
  <g transform="translate(56,396)"><use href="#g-relay"/></g>
  <text class="t-name ink" x="98" y="415">A relay app</text>
  <text class="t-cap muted" x="98" y="433">words written elsewhere</text>
  <line class="track" x1="250" y1="407" x2="452" y2="407"/>
  <rect class="chip-pass" x="452" y="389" width="124" height="36" rx="8"/>
  <text class="t-chip ink" x="514" y="412" text-anchor="middle">bot</text>
  <line class="track" x1="576" y1="407" x2="700" y2="407"/>

  <text class="t-cap muted" x="514" y="452" text-anchor="middle">bot outranks membership</text>

  <!-- ===================== the context ===================== -->
  <rect class="panel" x="700" y="116" width="524" height="356" rx="14"/>
  <text class="t-mark muted" x="728" y="146">ONE MODEL CONTEXT</text>

  <rect x="728" y="158" width="468" height="40" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-width="1.5"/>
  <text class="t-name ink" x="750" y="184">Your own instructions</text>

  <g>
    <rect x="728" y="212" width="468" height="34" rx="7" fill="#EDF7F0" stroke="#15803D" stroke-width="1.25"/>
    <text class="t-chip ok" x="750" y="234">self</text>
    <text class="t-cap ok" x="1174" y="234" text-anchor="end">trusted</text>
  </g>
  <g>
    <rect x="728" y="254" width="468" height="34" rx="7" fill="#EDF7F0" stroke="#15803D" stroke-width="1.25"/>
    <text class="t-chip ok" x="750" y="276">internal</text>
    <text class="t-cap ok" x="1174" y="276" text-anchor="end">trusted</text>
  </g>
  <g>
    <rect x="728" y="296" width="468" height="34" rx="7" fill="#F7F7F8" stroke="#9CA3AF" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text class="t-chip ink" x="750" y="318">external</text>
    <text class="t-cap muted" x="1174" y="318" text-anchor="end">untrusted</text>
  </g>
  <g>
    <rect x="728" y="338" width="468" height="34" rx="7" fill="#F7F7F8" stroke="#9CA3AF" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text class="t-chip ink" x="750" y="360">bot</text>
    <text class="t-cap muted" x="1174" y="360" text-anchor="end">untrusted</text>
  </g>

  <text class="t-cap muted" x="728" y="404">Labelled, never removed. An author the server cannot place</text>
  <text class="t-cap muted" x="728" y="422">inside the workspace is reported untrusted.</text>
  <text class="t-cap muted" x="728" y="447">Read and write share one toolset — which is the risk below.</text>

  <!-- ===================== the way back out ===================== -->
  <text class="t-mark muted" x="56" y="556">THE WAY BACK OUT</text>

  <!-- one line: context -> send tool -> the boundary, right to left -->
  <path class="track-w" d="M 962 472 L 962 600 L 836 600" marker-end="url(#tb-arrow)"/>
  <rect class="panel" x="660" y="580" width="176" height="40" rx="9"/>
  <text class="t-chip ink" x="748" y="605" text-anchor="middle">slack_send_message</text>
  <path class="track-w" d="M 660 600 L 560 600" marker-end="url(#tb-arrow)"/>

  <rect x="332" y="564" width="228" height="34" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text class="t-chip stop" x="352" y="586">strict</text>
  <text class="t-cap stop" x="540" y="586" text-anchor="end">held</text>

  <rect x="332" y="606" width="228" height="34" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text class="t-chip stop" x="352" y="628">read-only</text>
  <text class="t-cap stop" x="540" y="628" text-anchor="end">never registered</text>

  <text class="t-cap muted" x="56" y="588">A send is held once the session has</text>
  <text class="t-cap muted" x="56" y="606">read outside-authored text. Read-only</text>
  <text class="t-cap muted" x="56" y="624">removes the tool instead of trusting it.</text>

  <!-- ===================== legend ===================== -->
  <line class="edge" x1="56" y1="664" x2="1224" y2="664"/>
  <rect x="56" y="680" width="11" height="11" rx="2.5" fill="#EDF7F0" stroke="#15803D" stroke-width="1.5"/>
  <text class="t-cap muted" x="76" y="690">placed inside the workspace</text>
  <rect x="268" y="680" width="11" height="11" rx="2.5" fill="#F2F3F5" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <text class="t-cap muted" x="288" y="690">labelled and passed through</text>
  <rect x="500" y="680" width="11" height="11" rx="2.5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text class="t-cap muted" x="520" y="690">refused</text>
  <text class="t-cap muted" x="1224" y="690" text-anchor="end">@jtalk22/slack-mcp</text>
</svg>
