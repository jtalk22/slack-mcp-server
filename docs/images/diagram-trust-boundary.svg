<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">The trust boundary: who wrote a Slack message, and what the server does about it</title>
  <desc id="tb-desc">Four kinds of author put text into the same Slack channel: the operator, a colleague in the workspace, a Slack Connect participant from another workspace, and an app relaying words written outside Slack. Each crosses the server's trust boundary on its own straight track and is stamped with an origin — self and internal are stamped trusted, external and bot are labelled and passed through rather than removed. All four arrive in one model context, alongside the operator's own instructions, which is the risk: the same toolset that reads also writes. On the way back out, strict mode holds a send once outside-authored text has been read, and read-only never registers the write tool at all.</desc>

  <defs>
    <style>
      .ground { fill: #FBFBF9; }
      .ink    { fill: #16181D; }
      .muted  { fill: #6B7280; }
      .faint  { fill: #9CA3AF; }
      .ok     { fill: #15803D; }
      .stop   { fill: #DC2626; }

      .t-title { font: 600 28px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.3px; }
      .t-lede  { font: 400 15.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-name  { font: 500 16.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-sub   { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-chip  { font: 500 14.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .t-cap   { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .t-mark  { font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 1.5px; }

      .track { stroke: #BFC1C7; stroke-width: 1.5; fill: none; }
      .flow  { stroke: #16181D; stroke-width: 1.75; fill: none; }
      .panel { fill: #FFFFFF; stroke: #E3E4E9; stroke-width: 1.25; }

      .chip-ok   { fill: #EDF7F0; stroke: #15803D; stroke-width: 1.75; }
      .chip-pass { fill: #F1F2F4; stroke: #8A8D95; stroke-width: 1.75; stroke-dasharray: 5 4; }

      .glyph { fill: none; stroke: #16181D; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
      .wall  { stroke: #8A8D95; stroke-width: 2; stroke-linecap: round; }
    </style>

    <marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16181D"/>
    </marker>

    <!-- One family. A dashed wall beside a glyph means the author sits outside
         this workspace. The answer is in the icon before a word is read. -->
    <g id="g-you">
      <circle cx="13" cy="9" r="5.6" class="glyph"/>
      <path d="M 3 25.5 a 10 9.5 0 0 1 20 0" class="glyph"/>
    </g>
    <g id="g-colleagues">
      <circle cx="10" cy="9" r="5.1" class="glyph"/>
      <path d="M 1 25.5 a 9 8.5 0 0 1 18 0" class="glyph"/>
      <circle cx="22.5" cy="10.5" r="4.1" class="glyph"/>
      <path d="M 16 25.5 a 7.2 6.8 0 0 1 14 0" class="glyph"/>
    </g>
    <g id="g-connect">
      <circle cx="10" cy="9" r="5.4" class="glyph"/>
      <path d="M 1 25.5 a 9.4 8.8 0 0 1 18.8 0" class="glyph"/>
      <path d="M 26 1 L 26 27" class="wall" stroke-dasharray="3.5 4"/>
    </g>
    <g id="g-relay">
      <rect x="1" y="5" width="18" height="17" rx="4" class="glyph"/>
      <path d="M 6 11.5 h 8.5 M 6 16 h 5.5" class="glyph"/>
      <path d="M 26 1 L 26 27" class="wall" stroke-dasharray="3.5 4"/>
      <path d="M 20.5 13.5 h 3.2" class="glyph"/>
    </g>
  </defs>

  <rect class="ground" width="1280" height="720"/>

  <text class="t-title ink" x="56" y="60">The trust boundary</text>
  <text class="t-lede muted" x="56" y="89">Four authors, one channel. Every message is stamped on the way in — and the one that cannot be placed says so.</text>

  <!-- the boundary -->
  <line x1="408" y1="128" x2="408" y2="498" stroke="#16181D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="t-mark muted" x="408" y="118" text-anchor="middle">THE BOUNDARY</text>

  <!-- ============ four tracks, each landing on its own row ============ -->

  <g transform="translate(56,227)"><use href="#g-you"/></g>
  <text class="t-name ink" x="104" y="247">You</text>
  <line class="track" x1="250" y1="240" x2="452" y2="240"/>
  <rect class="chip-ok" x="452" y="222" width="128" height="36" rx="8"/>
  <text class="t-chip ok" x="516" y="245" text-anchor="middle">self</text>
  <line class="track" x1="580" y1="240" x2="716" y2="240"/>

  <g transform="translate(56,297)"><use href="#g-colleagues"/></g>
  <text class="t-name ink" x="104" y="317">A colleague</text>
  <line class="track" x1="250" y1="310" x2="452" y2="310"/>
  <rect class="chip-ok" x="452" y="292" width="128" height="36" rx="8"/>
  <text class="t-chip ok" x="516" y="315" text-anchor="middle">internal</text>
  <line class="track" x1="580" y1="310" x2="716" y2="310"/>

  <g transform="translate(56,364)"><use href="#g-connect"/></g>
  <text class="t-name ink" x="104" y="380">Slack Connect</text>
  <text class="t-sub faint" x="104" y="398">someone else's workspace</text>
  <line class="track" x1="250" y1="380" x2="452" y2="380"/>
  <rect class="chip-pass" x="452" y="362" width="128" height="36" rx="8"/>
  <text class="t-chip ink" x="516" y="385" text-anchor="middle">external</text>
  <line class="track" x1="580" y1="380" x2="716" y2="380"/>

  <g transform="translate(56,434)"><use href="#g-relay"/></g>
  <text class="t-name ink" x="104" y="450">A relay app</text>
  <text class="t-sub faint" x="104" y="468">words written somewhere else</text>
  <line class="track" x1="250" y1="450" x2="452" y2="450"/>
  <rect class="chip-pass" x="452" y="432" width="128" height="36" rx="8"/>
  <text class="t-chip ink" x="516" y="455" text-anchor="middle">bot</text>
  <line class="track" x1="580" y1="450" x2="716" y2="450"/>

  <text class="t-sub faint" x="580" y="519" text-anchor="middle">a bot inside your workspace still relays words from outside it</text>

  <!-- ============ the context ============ -->
  <rect class="panel" x="716" y="128" width="508" height="370" rx="14"/>
  <text class="t-mark muted" x="744" y="160">ONE MODEL CONTEXT</text>

  <rect x="744" y="172" width="452" height="38" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-width="1.6"/>
  <text class="t-name ink" x="764" y="197">Your own instructions</text>

  <rect x="744" y="222" width="452" height="36" rx="8" fill="#EDF7F0" stroke="#15803D" stroke-width="1.4"/>
  <text class="t-chip ok" x="764" y="245">self</text>
  <text class="t-cap ok" x="1176" y="245" text-anchor="end">trusted</text>

  <rect x="744" y="292" width="452" height="36" rx="8" fill="#EDF7F0" stroke="#15803D" stroke-width="1.4"/>
  <text class="t-chip ok" x="764" y="315">internal</text>
  <text class="t-cap ok" x="1176" y="315" text-anchor="end">trusted</text>

  <rect x="744" y="362" width="452" height="36" rx="8" fill="#F1F2F4" stroke="#8A8D95" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="t-chip ink" x="764" y="385">external</text>
  <text class="t-cap muted" x="1176" y="385" text-anchor="end">untrusted</text>

  <rect x="744" y="432" width="452" height="36" rx="8" fill="#F1F2F4" stroke="#8A8D95" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="t-chip ink" x="764" y="455">bot</text>
  <text class="t-cap muted" x="1176" y="455" text-anchor="end">untrusted</text>

  <!-- ============ the way back out ============ -->
  <text class="t-mark muted" x="56" y="556">THE WAY BACK OUT</text>
  <text class="t-cap muted" x="56" y="582">Labelled, never removed — and read and write</text>
  <text class="t-cap muted" x="56" y="601">share one toolset. That is the whole risk.</text>

  <path class="flow" d="M 970 498 L 970 592 L 892 592" marker-end="url(#tb-arrow)"/>
  <rect class="panel" x="712" y="572" width="180" height="40" rx="9"/>
  <text class="t-chip ink" x="802" y="597" text-anchor="middle">slack_send_message</text>
  <path class="flow" d="M 712 592 L 620 592" marker-end="url(#tb-arrow)"/>

  <rect x="368" y="554" width="248" height="34" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text class="t-chip stop" x="388" y="576">strict</text>
  <text class="t-cap stop" x="596" y="576" text-anchor="end">held</text>

  <rect x="368" y="596" width="248" height="34" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text class="t-chip stop" x="388" y="618">read-only</text>
  <text class="t-cap stop" x="596" y="618" text-anchor="end">never registered</text>

  <!-- ============ legend ============ -->
  <line x1="56" y1="664" x2="1224" y2="664" stroke="#E3E4E9" stroke-width="1.25"/>
  <rect x="56" y="680" width="12" height="12" rx="3" fill="#EDF7F0" stroke="#15803D" stroke-width="1.6"/>
  <text class="t-cap muted" x="78" y="691">placed inside your workspace</text>
  <rect x="300" y="680" width="12" height="12" rx="3" fill="#F1F2F4" stroke="#8A8D95" stroke-width="1.6" stroke-dasharray="3 2.5"/>
  <text class="t-cap muted" x="322" y="691">labelled, and passed through anyway</text>
  <rect x="604" y="680" width="12" height="12" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text class="t-cap muted" x="626" y="691">refused</text>
  <text class="t-cap faint" x="1224" y="691" text-anchor="end">@jtalk22/slack-mcp</text>
</svg>
