# Smithery configuration for slack-mcp-server
# https://smithery.ai/docs/build/project-config/smithery-yaml
# Slack MCP — session tokens, not OAuth: no app to register, no admin approval.
# 21 tools: Slack read/write + workflow-profile primitives + discoverable AI
# upgrade stubs (hosted tier at mcp.revasserlabs.com — free tier, $19/mo Pro).

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      slackToken:
        type: string
        title: "Slack Token"
        description: "Your xoxc- token from browser session. Optional on macOS (auto-extracted from Chrome)."
        pattern: "^xoxc-.*$"
      slackCookie:
        type: string
        title: "Slack Cookie"
        description: "Your xoxd- cookie from browser session. Optional on macOS (auto-extracted from Chrome)."
        pattern: "^xoxd-.*$"
      autoRefresh:
        type: boolean
        title: "Auto Refresh"
        description: "Enable automatic token refresh from Chrome (macOS only)"
        default: true
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['src/server.js'],
      env: {
        ...(config.slackToken && { SLACK_TOKEN: config.slackToken }),
        ...(config.slackCookie && { SLACK_COOKIE: config.slackCookie }),
        ...(config.autoRefresh === false && { SLACK_NO_AUTO_REFRESH: 'true' })
      }
    })
