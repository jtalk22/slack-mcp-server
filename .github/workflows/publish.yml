name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # 24.x, not 20.x, because npm trusted publishing needs npm >= 11.5.1
          # and Node >= 22.14.0. Node 20 bundles npm 10.x, which has no OIDC
          # support at all -- that is why the January 2026 attempt at OIDC
          # publishing failed within two minutes and the token came straight
          # back (4712400 -> 6bf61b4 -> 41d25c8 -> 3e58433). 24.x already runs
          # in the CI matrix, so this adds no new surface.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Unable to resolve semver from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"

      - name: Check npm for existing version
        id: npm_check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@jtalk22/slack-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already exists on npm. Skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not found on npm. Proceeding with publish."
          fi

      # Replaces the old "Verify npm publish auth" step, which ran
      # scripts/check-npm-publish-auth.sh -> npm whoami -> npm owner ls.
      # Under trusted publishing there is no authenticated user to name: the
      # OIDC exchange happens inside `npm publish`, so `npm whoami` returns
      # E401 and that preflight would fail every release before reaching the
      # publish. It is exactly what failed on v5.0.1 (run 36762488694,
      # 2026-09-30) once NPM_SECRET_TOKEN expired, which is why 5.0.1 is
      # tagged and released on GitHub but absent from npm.
      #
      # What is worth asserting instead is the floor that silently broke
      # January's attempt. A publish that fails because npm is too old to do
      # OIDC reports a misleading 404; this turns that into one readable line.
      - name: Verify npm supports trusted publishing
        if: steps.npm_check.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION / node $(node --version)"
          # Sorted order means 11.5.1 <= installed, i.e. the floor is met.
          if ! printf '11.5.1\n%s\n' "$NPM_VERSION" | sort -V -C; then
            echo "npm $NPM_VERSION is below the 11.5.1 floor for trusted publishing." >&2
            echo "Raise node-version in this workflow, or add 'npm install -g npm@latest'." >&2
            exit 1
          fi

      # Authentication is GitHub OIDC (npm trusted publishing) first. The
      # id-token: write permission above lets npm exchange an Actions OIDC token
      # for a short-lived publish credential; the registry-side trust for
      # repository jtalk22/slack-mcp-server, workflow publish.yml, was created on
      # 2026-10-07 and confirmed with `npm trust list @jtalk22/slack-mcp`.
      #
      # NPM_TOKEN is a fallback, not the route. npm's OIDC step sets the token it
      # receives over whatever the .npmrc holds, and on any failure leaves the
      # stored token in place (npm/lib/utils/oidc.js), so a broken exchange still
      # publishes instead of repeating 5.0.1. The token is a granular one that
      # expires 2027-01-05; once a release has gone out through OIDC alone, the
      # fallback can be removed.
      #
      # --provenance is kept deliberately. npm's docs say provenance is
      # generated automatically under trusted publishing, but keeping the flag
      # states the guarantee explicitly rather than depending on a default.
      - name: Verify server.json matches release version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SJ_VERSION="$(jq -r '.version' server.json)"
          if [[ "$SJ_VERSION" != "$VERSION" ]]; then
            echo "server.json version ($SJ_VERSION) does not match release version ($VERSION)" >&2
            exit 1
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Check MCP registry for existing version
        id: registry_check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSIONS_URL="https://registry.modelcontextprotocol.io/v0/servers/io.github.jtalk22%2Fslack-mcp-server/versions"
          # Distinguish "version not listed" from a failed lookup: only a 200 with the
          # version absent (or a 404 for a never-published server) may proceed to publish.
          HTTP_CODE="$(curl -sSL -o /tmp/registry-versions.json -w '%{http_code}' "$VERSIONS_URL")" || {
            echo "MCP registry lookup failed (network error)" >&2
            exit 1
          }
          if [[ "$HTTP_CODE" == "404" ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Server not found in the MCP registry. Proceeding with first registry publish."
          elif [[ "$HTTP_CODE" != "200" ]]; then
            echo "MCP registry lookup failed with HTTP $HTTP_CODE" >&2
            exit 1
          elif jq -e --arg v "$VERSION" '[.servers[] | (.server.version // .version)] | index($v) != null' /tmp/registry-versions.json >/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already exists in the MCP registry. Skipping registry publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not found in the MCP registry. Proceeding with registry publish."
          fi

      - name: Wait for npm propagation
        if: steps.registry_check.outputs.already_published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The registry validates the exact npm version exists before accepting a publish.
          for i in $(seq 1 10); do
            if npm view "@jtalk22/slack-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "npm has $VERSION."
              exit 0
            fi
            echo "npm does not show $VERSION yet (attempt $i/10); waiting 15s..."
            sleep 15
          done
          echo "npm version $VERSION not visible after 10 attempts" >&2
          exit 1

      - name: Verify live npm description matches package.json
        if: steps.npm_check.outputs.already_published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # npm metadata is immutable per version; a stale description on the live
          # surface can only heal on the next publish. Catch the mismatch NOW,
          # while this run can still be diagnosed, instead of months later.
          EXPECTED="$(jq -r '.description' package.json)"
          for i in $(seq 1 10); do
            LIVE="$(npm view "@jtalk22/slack-mcp@$VERSION" description 2>/dev/null || true)"
            if [[ "$LIVE" == "$EXPECTED" ]]; then
              echo "Live npm description matches package.json."
              exit 0
            fi
            echo "Live description not settled yet (attempt $i/10); waiting 15s..."
            sleep 15
          done
          echo "Live npm description does not match package.json after 10 attempts." >&2
          echo "expected: $EXPECTED" >&2
          echo "live:     $LIVE" >&2
          exit 1

      - name: Publish to MCP registry
        if: steps.registry_check.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
