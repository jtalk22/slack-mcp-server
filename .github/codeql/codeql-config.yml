name: "slack-mcp-server CodeQL config"

# Why security-extended and not the default suite.
#
# The difference is precision. The default code-scanning suite selects only
# @precision high and very-high (misc/suite-helpers/code-scanning-selectors.yml);
# security-extended adds @precision medium where the severity is error or
# warning. On this tree that is 16 of the 103 rules that run, and it is where
# the findings worth having came from:
#
#   - js/file-system-race is @precision medium, so the default suite would not
#     have run it. It is what surfaced the API key being written under the
#     default umask and only then chmod-ed to 0600 -- a real window in which a
#     credential sat world-readable on disk.
#   - js/file-access-to-http and js/http-to-file-access are also medium, and
#     account for 6 of the 12 alerts catalogued in the pull request.
#
# js/type-confusion-through-parameter-tampering, the other real bug this
# caught, is @precision high and would have been found either way.
#
# A full run finishes in about a minute on ~13.5k lines, so the extra queries
# cost effectively nothing.
queries:
  - uses: security-extended

# There is no paths-ignore, and that is a measured result rather than an
# oversight.
#
# GitHub's guidance is to minimise exclusions and justify each one, so the
# baseline was run with no exclusions first and the alert list read before
# anything was written here. The expectation going in was that the 17
# token-shaped fixtures in test/ and scripts/verify-install-flow.js would each
# raise js/hardcoded-credentials and would need excluding by path. They did
# not raise anything, and the reason generalises: js/hardcoded-credentials is
# @precision low, while both security-extended and security-and-quality select
# only high, very-high, and medium. That query is in no suite, so no suite
# config can make the fixtures fire, and excluding those files by path would
# suppress nothing while blinding the scan to real code.
#
# Real Slack credentials are covered by a better-suited instrument that is
# already on: secret scanning with push protection, whose provider patterns
# match genuine xoxc/xoxd values and correctly ignore the fixtures. Note that
# secret_scanning_non_provider_patterns must stay DISABLED -- enabling it is
# what would start blocking pushes on those fixtures.
#
# The full baseline (17 alerts, 2 of them a deliberately planted positive)
# and the disposition of each is recorded in the pull request that added this
# file. Anything added below must name the alert it suppresses and the run
# that produced it.
#
# node_modules/ and the CodeQL database directory are excluded by the
# extractor itself and do not need listing.
